<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04182b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Water Flappy">
<title>Water Flappy</title>
<meta name="application-name" content="Water Flappy">
<meta name="description" content="Water Flappy – Ozean- und Dunkelwelt mit Skins und lokalem Spielstand.">
<style>
  html, body {
    margin: 0; height: 100%; background: #04182b;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, Arial, sans-serif;
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    height: min(100vh, 133.33vw);
    height: min(100dvh, 133.33vw);
    width: auto;
    display: block;
    cursor: pointer;
    touch-action: none;
  }


  /* Unsichtbarer Klickbereich genau über der Rekordanzeige */
  #adminHit {
    position: fixed;
    z-index: 10;
    border: 0;
    padding: 0;
    margin: 0;
    background: transparent;
    opacity: 0;
    cursor: pointer;
    touch-action: manipulation;
  }

  /* Eigenes Passwortfenster statt Browser-prompt */
  #adminLogin {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 12, 28, 0.82);
    touch-action: manipulation;
  }
  #adminLogin.show { display: flex; }
  #adminLoginBox {
    width: min(84vw, 360px);
    box-sizing: border-box;
    border: 2px solid rgba(255,255,255,.55);
    border-radius: 18px;
    background: #082542;
    padding: 22px;
    box-shadow: 0 18px 55px rgba(0,0,0,.45);
    text-align: center;
    color: white;
    user-select: auto;
    -webkit-user-select: auto;
  }
  #adminLoginBox h2 { margin: 0 0 8px; color: #ffd27a; }
  #adminLoginBox p { margin: 0 0 14px; color: #d6ecff; }
  #adminPassword {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,.45);
    background: #fff;
    color: #111;
    font-size: 20px;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
  }
  #adminError { min-height: 24px; margin-top: 8px; color: #ff9a8a; font-weight: 800; }
  .adminLoginBtns { display: flex; gap: 10px; margin-top: 8px; }
  .adminLoginBtns button {
    flex: 1;
    border: 0;
    border-radius: 11px;
    padding: 11px 8px;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
  }
  #adminEnter { background: #ffd27a; color: #082542; }
  #adminCancel { background: #d6ecff; color: #082542; }

</style>
</head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<input id="saveFileInput" type="file" accept="application/json,.json" style="display:none">
<button id="adminHit" type="button" aria-label=""></button>
<div id="adminLogin" aria-hidden="true">
  <div id="adminLoginBox">
    <h2>Admin</h2>
    <p>Passwort eingeben</p>
    <input id="adminPassword" type="password" autocomplete="off" maxlength="40" placeholder="Passwort">
    <div id="adminError"></div>
    <div class="adminLoginBtns">
      <button id="adminCancel" type="button">Abbrechen</button>
      <button id="adminEnter" type="button">Öffnen</button>
    </div>
  </div>
</div>
<script>
(() => {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const adminHit = document.getElementById('adminHit');
  const adminLogin = document.getElementById('adminLogin');
  const adminPassword = document.getElementById('adminPassword');
  const adminError = document.getElementById('adminError');
  const adminEnter = document.getElementById('adminEnter');
  const adminCancel = document.getElementById('adminCancel');
  const W = 480, H = 640;
  const FLOOR = H - 50;

  // ---------- Spielwerte ----------
  const GRAVITY = 1500, JUMP = -430, PIPEW = 72;
  let SPEED = 175, GAP = 180;   // werden vom Schwierigkeitsgrad gesetzt

  // ---------- Schwierigkeitsgrade (hoeher = mehr Perlen) ----------
  const DIFFS = [
    { id: 'easy',    name: 'Einfach', gap: 215, speed: 150, mult: 1, mode: 'straight' },
    { id: 'mid',     name: 'Mittel',  gap: 180, speed: 175, mult: 2, mode: 'gentle' },
    { id: 'hard',    name: 'Schwer',  gap: 155, speed: 205, mult: 3, mode: 'random' },
    { id: 'extreme', name: 'Extrem',  gap: 140, speed: 235, mult: 5, mode: 'moving' }
  ];

  // ---------- Skins (Meeresfische) ----------
  const SKINS = [
    { id: 'gold',    name: 'Goldfisch',        price: 0,   body: '#ffb347', belly: '#ffd89a', fin: '#ff8f1f', pat: 'none' },
    { id: 'clown',   name: 'Clownfisch',       price: 20,  body: '#ff7a1a', belly: '#ffa14d', fin: '#e85d04', pat: 'clown' },
    { id: 'puffer',  name: 'Kugelfisch',       price: 50,  body: '#e8d25a', belly: '#fff3b0', fin: '#b89a1c', pat: 'puffer', scale: 1.1 },
    { id: 'doctor',  name: 'Doktorfisch',      price: 80,  body: '#2f7bff', belly: '#2f7bff', fin: '#ffd400', pat: 'doctor' },
    { id: 'shark',   name: 'Hai',              price: 150, body: '#7b8da0', belly: '#eef3f8', fin: '#5d6e7f', pat: 'shark' },
    { id: 'angler',  name: 'Anglerfisch',      price: 250, body: '#3a2a52', belly: '#5b4580', fin: '#2a1d3d', pat: 'angler' },
    { id: 'rainbow', name: 'Regenbogenfisch',  price: -1,  body: '#ffffff', belly: 'rgba(255,255,255,0.35)', fin: '#ff6ad5', pat: 'rainbow' }
  ];
  const WORLDS = [{id:'ocean',name:'Ozean',desc:'Kostenlos',starter:'gold',pearls:0,record:0,icon:'🌊'}, {id:'space',name:'Dunkelwelt',desc:'Schwarzer Weltraum',starter:'rocket',pearls:300,record:15,icon:'🌑'}, {id:'lava',name:'Lavawelt',desc:'Vulkane und Feuer',starter:'ember',pearls:600,record:25,icon:'🌋'}, {id:'ice',name:'Eiswelt',desc:'Schnee und Eis',starter:'snow',pearls:1000,record:40,icon:'❄️'}, {id:'forest',name:'Dschungel',desc:'Grüner Urwald',starter:'leaf',pearls:1500,record:60,icon:'🌴'}];
  // Jede spaetere Welt hat staerkere Stroemung und wird schwieriger.
  const WORLD_RULES = {
    // Je weiter die Welt, desto schwerer - aber desto mehr Perlen gibt es pro eingesammelter Perle.
    ocean:  { level:1, label:'Leicht',       speedBonus:0,  gapPenalty:0,  currentForce:26,  currentFreq:0.80, pearlMult:1, jetChance:0.04, jetForce:115 },
    space:  { level:2, label:'Mittel',       speedBonus:12, gapPenalty:6,  currentForce:45,  currentFreq:0.92, pearlMult:2, jetChance:0.08, jetForce:145 },
    lava:   { level:3, label:'Stark',        speedBonus:24, gapPenalty:12, currentForce:65,  currentFreq:1.05, pearlMult:3, jetChance:0.12, jetForce:175 },
    ice:    { level:4, label:'Sehr stark',   speedBonus:38, gapPenalty:20, currentForce:88,  currentFreq:1.18, pearlMult:4, jetChance:0.17, jetForce:210 },
    forest: { level:5, label:'Extrem',       speedBonus:54, gapPenalty:28, currentForce:115, currentFreq:1.32, pearlMult:5, jetChance:0.22, jetForce:250 }
  };
  const worldRule = () => WORLD_RULES[(typeof save !== 'undefined' && save.world) || 'ocean'] || WORLD_RULES.ocean;
  const SPACE_SKINS = [
    {id:'rocket',name:'Rakete',price:0,body:'#e9efff',belly:'#9fc7ff',fin:'#ff674b',pat:'rocket'},
    {id:'ufo',name:'UFO',price:35,body:'#8ef0e5',belly:'#b5a5ff',fin:'#6e67d9',pat:'ufo'},
    {id:'comet',name:'Komet',price:90,body:'#ffca62',belly:'#fff2ba',fin:'#ff713a',pat:'comet'},
    {id:'alien',name:'Alien',price:160,body:'#7de777',belly:'#a5ff9a',fin:'#348e64',pat:'alien'}
  ];
  const EXTRA_SKINS = {
    lava:[{id:'ember',name:'Feuergeist',price:0,body:'#ff6b17',belly:'#ffdf50',fin:'#db2510',pat:'comet'},{id:'magma',name:'Magma',price:130,body:'#ad2d13',belly:'#ff812b',fin:'#ffdd44',pat:'puffer'},{id:'phoenix',name:'Phönix',price:300,body:'#ffcb24',belly:'#ff5a24',fin:'#ff291b',pat:'clown'}],
    ice:[{id:'snow',name:'Schneefisch',price:0,body:'#c9f5ff',belly:'#ffffff',fin:'#77d8ff',pat:'none'},{id:'frost',name:'Frosthai',price:180,body:'#66b6e9',belly:'#effaff',fin:'#3686c4',pat:'shark'},{id:'crystal',name:'Kristall',price:350,body:'#c3a4ff',belly:'#eff6ff',fin:'#7e72ee',pat:'puffer'}],
    forest:[{id:'leaf',name:'Blattfisch',price:0,body:'#59d45b',belly:'#b9f18a',fin:'#1b8b45',pat:'none'},{id:'frog',name:'Dschungelfrosch',price:200,body:'#45ba39',belly:'#dcf9a1',fin:'#248c2d',pat:'puffer'},{id:'jungle',name:'Urwalddrache',price:450,body:'#168e78',belly:'#75e1aa',fin:'#e6c531',pat:'shark'}]
  };
  const allSkins = () => SKINS.concat(SPACE_SKINS,...Object.values(EXTRA_SKINS));
  const currentSkins = () => save.world === 'ocean' ? SKINS : save.world === 'space' ? SPACE_SKINS : EXTRA_SKINS[save.world];
  const skinById = id => allSkins().find(s => s.id === id) || SKINS[0];

  // ---------- Speicherstand ----------
  let storageOK = true;
  const save = { pearls: 0, owned: ['gold'], skin: 'gold', egg: false, diff: 1, world: 'ocean', world2Unlocked: false, unlockedWorlds:['ocean'], worldSkins: {ocean:'gold',space:'rocket',lava:'ember',ice:'snow',forest:'leaf'}, bests: { easy: 0, mid: 0, hard: 0, extreme: 0 }, stats:{pearlsCollected:0,games:0,maxRun:0,powerups:0}, missions:{pearl25:false,score15:false,games10:false}, achievements:{firstPearl:false,score10:false,world2:false,power5:false,pearl500:false} };
  try {
    const s = JSON.parse(localStorage.getItem('waterFlappySave') || 'null');
    if (s && typeof s === 'object') Object.assign(save, s);
    if (!save.bests || typeof save.bests !== 'object') save.bests = { easy: 0, mid: 0, hard: 0, extreme: 0 };
    const oldBest = Math.max(+localStorage.getItem('waterFlappyBest') || 0, +save.best || 0);
    if (oldBest > (+save.bests.mid || 0)) save.bests.mid = oldBest;
  } catch (e) {}
  if (!Array.isArray(save.owned) || !save.owned.includes('gold')) save.owned = ['gold'].concat(save.owned || []);
  save.owned = save.owned.filter(id => id !== 'facefish');
  if (save.skin === 'facefish') save.skin = 'gold';
  if (save.worldSkins && save.worldSkins.ocean === 'facefish') save.worldSkins.ocean = 'gold';
  if (!save.stats || typeof save.stats !== 'object') save.stats = {pearlsCollected:0,games:0,maxRun:0,powerups:0};
  save.stats.pearlsCollected = Math.max(0, +save.stats.pearlsCollected || 0);
  save.stats.games = Math.max(0, +save.stats.games || 0);
  save.stats.maxRun = Math.max(0, +save.stats.maxRun || 0);
  save.stats.powerups = Math.max(0, +save.stats.powerups || 0);
  if (!save.missions || typeof save.missions !== 'object') save.missions = {pearl25:false,score15:false,games10:false};
  ['pearl25','score15','games10'].forEach(k => save.missions[k] = !!save.missions[k]);
  if (!save.achievements || typeof save.achievements !== 'object') save.achievements = {firstPearl:false,score10:false,world2:false,power5:false,pearl500:false};
  ['firstPearl','score10','world2','power5','pearl500'].forEach(k => save.achievements[k] = !!save.achievements[k]);
  DIFFS.forEach(d => { save.bests[d.id] = +save.bests[d.id] || 0; });
  delete save.best;
  if (!(save.diff >= 0 && save.diff < DIFFS.length)) save.diff = 1;
  if (!WORLDS.some(w => w.id === save.world)) save.world = 'ocean';
  save.world2Unlocked = !!save.world2Unlocked;
  if (!Array.isArray(save.unlockedWorlds)) save.unlockedWorlds=['ocean'];
  if(save.world2Unlocked && !save.unlockedWorlds.includes('space')) save.unlockedWorlds.push('space');
  for(const w of WORLDS) if(!save.owned.includes(w.starter)) save.owned.push(w.starter);
  if (!save.owned.includes('rocket')) save.owned.push('rocket');
  if (!save.worldSkins) save.worldSkins = {ocean:save.skin,space:'rocket'};
  for(const w of WORLDS) if(!save.worldSkins[w.id]) save.worldSkins[w.id]=w.starter;
  if (!save.owned.includes(save.skin)) save.skin = 'gold';
  save.skin = save.worldSkins[save.world] || WORLDS.find(w=>w.id===save.world).starter;

  function persist() {
    try {
      localStorage.setItem('waterFlappySave', JSON.stringify(save));
      storageOK = true;
    } catch (e) { storageOK = false; }
  }

  let D = DIFFS[1];
  function applyDiff(i, store) {
    D = DIFFS[i];
    const wr = worldRule();
    GAP = Math.max(118, D.gap - wr.gapPenalty);
    SPEED = D.speed + wr.speedBonus;
    save.diff = i;
    if (store) persist();
  }
  const bestNow = () => save.bests[D.id] || 0;
  const pearlReward = () => D.mult * worldRule().pearlMult;
  applyDiff(save.diff, true);

  // ---------- Zustand ----------
  let state = 'ready';          // ready | play | over | shop | worlds | extras | about | admin
  let score = 0, runPearls = 0;
  const fish = { x: 130, y: H / 2, vy: 0, r: 16 };
  let pipes = [], bubbles = [], lastGapY = null;
  let t = 0, spawnT = 0, overT = 0, floorOff = 0, flash = 0, titlePulse = 0;
  let shieldActive = false, magnetUntil = 0, slowUntil = 0, doubleUntil = 0, invulnUntil = 0;
  const toast = { text: '', until: 0 };
  let eggTaps = 0, eggLast = -10, keyBuf = '';
  let adminTaps = 0, adminFirstTapMs = 0, adminLastTapMs = 0, resetArm = 0;

  for (let i = 0; i < 30; i++) {
    bubbles.push({ x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 4, v: 15 + Math.random() * 35 });
  }

  // ---------- UI-Flaechen ----------
  const TITLE   = { x: 80,  y: 145, w: 320, h: 70 };
  const WORLD_BTN = {x:55,y:500,w:170,h:40};
  const SHOPBTN = { x:255, y:500, w:170, h:40 };
  const EXTRASBTN = { x:55, y:548, w:170, h:38 };
  const ABOUTBTN = { x:255, y:548, w:170, h:38 };
  const diffBtn = i => ({ x: 28 + i * 108, y: 440, w: 100, h: 50 });
  // Geheimer Admin-Zugang: 7x schnell auf die Rekordanzeige oben rechts tippen
  const RECORD_ADMIN = { x: 190, y: 0, w: 290, h: 90 };
  const ADMIN_BTNS = [
    { id: 'unlock', label: 'Alle Skins freischalten',  x: 90, y: 150, w: 300, h: 44 },
    { id: 'world2', label: 'Alle Welten freischalten',      x: 90, y: 204, w: 300, h: 44 },
    { id: 'pearls', label: '+1000 Perlen',             x: 90, y: 258, w: 300, h: 44 },
    { id: 'export', label: 'Speichercode anzeigen',    x: 90, y: 312, w: 300, h: 44 },
    { id: 'import', label: 'Speichercode eingeben',    x: 90, y: 366, w: 300, h: 44 },
    { id: 'reset',  label: 'Fortschritt zurücksetzen', x: 90, y: 420, w: 300, h: 44 },
    { id: 'close',  label: 'Schließen',                x: 90, y: 486, w: 300, h: 44 }
  ];
  const BACKBTN = { x: 165, y: 578, w: 150, h: 44 };
  const ROW0 = 150, ROWH = 60, ROWHH = 54;
  const WORLD2_PEARLS = 300, WORLD2_RECORD = 15;
  const overallBest = () => Math.max(...DIFFS.map(d => Number(save.bests[d.id]) || 0));
  function canUnlockWorld2() { return save.pearls >= WORLD2_PEARLS && overallBest() >= WORLD2_RECORD; }

  const MISSION_DEFS = [
    {id:'pearl25', name:'Perlenjäger', goal:25, reward:60, value:()=>save.stats.pearlsCollected, unit:'Perlen'},
    {id:'score15', name:'Flappy-Pro', goal:15, reward:100, value:()=>save.stats.maxRun, unit:'Punkte'},
    {id:'games10', name:'Ausdauer', goal:10, reward:120, value:()=>save.stats.games, unit:'Runden'}
  ];
  const ACHIEVEMENT_DEFS = [
    {id:'firstPearl', name:'Erste Perle', reward:10, done:()=>save.stats.pearlsCollected>=1},
    {id:'score10', name:'10 Punkte!', reward:20, done:()=>save.stats.maxRun>=10},
    {id:'world2', name:'Dunkelwelt entdeckt', reward:30, done:()=>save.unlockedWorlds.includes('space')},
    {id:'power5', name:'Power-Spieler', reward:40, done:()=>save.stats.powerups>=5},
    {id:'pearl500', name:'Perlenmeister', reward:100, done:()=>save.stats.pearlsCollected>=500}
  ];
  const POWER_TYPES = ['shield','magnet','slow','double'];
  function powerName(type){ return ({shield:'Schild',magnet:'Magnet',slow:'Zeitlupe',double:'x2 Perlen'})[type] || type; }
  function powerLetter(type){ return ({shield:'S',magnet:'M',slow:'Z',double:'x2'})[type] || '?'; }
  function checkProgress() {
    let changed = false, messages = [];
    for (const m of MISSION_DEFS) {
      if (!save.missions[m.id] && m.value() >= m.goal) {
        save.missions[m.id] = true; save.pearls += m.reward; changed = true;
        messages.push('Mission geschafft: '+m.name+' +'+m.reward+' Perlen');
      }
    }
    for (const a of ACHIEVEMENT_DEFS) {
      if (!save.achievements[a.id] && a.done()) {
        save.achievements[a.id] = true; save.pearls += a.reward; changed = true;
        messages.push('Erfolg: '+a.name+' +'+a.reward+' Perlen');
      }
    }
    if (changed) {
      persist();
      showToast(messages[messages.length-1], 4);
      beep(1120, .12);
      setTimeout(()=>beep(1450,.10), 110);
    }
  }
  function activatePower(type) {
    if (type === 'shield') shieldActive = true;
    else if (type === 'magnet') magnetUntil = Math.max(magnetUntil, t + 7);
    else if (type === 'slow') slowUntil = Math.max(slowUntil, t + 5.5);
    else if (type === 'double') doubleUntil = Math.max(doubleUntil, t + 8);
    save.stats.powerups++;
    showToast('Power-Up: '+powerName(type)+'!', 2.2);
    beep(980, .08);
    checkProgress();
    persist();
  }
  function useShield() {
    if (!shieldActive) return false;
    shieldActive = false; invulnUntil = t + .9; fish.vy = -180;
    showToast('Schild hat dich gerettet!', 2);
    beep(420,.08); setTimeout(()=>beep(700,.08),70);
    return true;
  }
  function positionAdminHit() {
    const r = c.getBoundingClientRect();
    // Deckt den gesamten sichtbaren Rekordbereich oben rechts ab.
    adminHit.style.left = (r.left + r.width * 0.40) + 'px';
    adminHit.style.top = r.top + 'px';
    adminHit.style.width = (r.width * 0.60) + 'px';
    adminHit.style.height = (r.height * 0.14) + 'px';
  }

  function askAdminPassword() {
    adminPassword.value = '';
    adminError.textContent = '';
    adminLogin.classList.add('show');
    adminLogin.setAttribute('aria-hidden', 'false');
    setTimeout(() => adminPassword.focus(), 30);
    return true;
  }

  function closeAdminPassword() {
    adminLogin.classList.remove('show');
    adminLogin.setAttribute('aria-hidden', 'true');
    adminPassword.blur();
  }

  function submitAdminPassword() {
    if (adminPassword.value.trim() === 'Fisch') {
      closeAdminPassword();
      state = 'admin';
      beep(880, 0.1);
    } else {
      adminError.textContent = 'Falsches Passwort';
      adminPassword.value = '';
      beep(180, 0.16);
      adminPassword.focus();
    }
  }

  function registerAdminTap(e) {
    if (e) e.preventDefault();
    if (state !== 'ready' && state !== 'over') return;
    const nowMs = Date.now();
    // 7 Klicks dürfen insgesamt bis zu 8 Sekunden dauern.
    if (!adminFirstTapMs || nowMs - adminFirstTapMs > 8000) {
      adminTaps = 0;
      adminFirstTapMs = nowMs;
    }
    adminLastTapMs = nowMs;
    adminTaps++;
    if (adminTaps >= 7) {
      adminTaps = 0;
      adminFirstTapMs = 0;
      adminLastTapMs = 0;
      askAdminPassword();
    }
  }

  adminHit.addEventListener('pointerdown', registerAdminTap);
  adminEnter.addEventListener('click', submitAdminPassword);
  adminCancel.addEventListener('click', closeAdminPassword);
  adminPassword.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submitAdminPassword(); }
    if (e.key === 'Escape') { e.preventDefault(); closeAdminPassword(); }
  });
  adminLogin.addEventListener('pointerdown', e => {
    if (e.target === adminLogin) closeAdminPassword();
  });
  window.addEventListener('resize', positionAdminHit);
  window.addEventListener('orientationchange', () => setTimeout(positionAdminHit, 100));
  if (window.ResizeObserver) new ResizeObserver(positionAdminHit).observe(c);
  requestAnimationFrame(positionAdminHit);
  function changeWorld(id) {
    const w=WORLDS.find(w=>w.id===id);if(!w)return;
    if(!save.unlockedWorlds.includes(id)) {
      if(save.pearls<w.pearls || overallBest()<w.record){showToast(w.name+': '+w.pearls+' Perlen + Rekord '+w.record+' nötig',3.5);beep(180,.16);return;}
      save.pearls-=w.pearls;save.unlockedWorlds.push(id);
      if(id==='space')save.world2Unlocked=true;
      showToast(w.name+' freigeschaltet!',3);beep(1050,.12);
    }
    save.world=id;save.skin=save.worldSkins[id]||w.starter;applyDiff(save.diff,false);checkProgress();persist();reset();state='ready';showToast('Welt: '+w.name+' • Strömung: '+worldRule().label);
  }
  function downloadSaveFile() {
    try {
      const data = {
        game: 'Water Flappy',
        version: 2,
        player: activeUser || 'spieler',
        savedAt: new Date().toISOString(),
        save: JSON.parse(JSON.stringify(save))
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      const safeName = (activeUser || 'spieler').replace(/[^a-z0-9_-]/gi,'_');
      a.href = URL.createObjectURL(blob);

  // ---------- Update ----------
  function update(dt) {
    t += dt;
    titlePulse = Math.max(0, titlePulse - dt * 4);

    for (const b of bubbles) {
      b.y -= b.v * dt;
      if (b.y < -10 && !b.temp) { b.y = H + 10; b.x = Math.random() * W; }
    }
    bubbles = bubbles.filter(b => !(b.temp && b.y < -12));

    if (state !== 'over') floorOff = (floorOff + SPEED * dt) % 40;

    if (state === 'ready') {
      fish.y = H / 2 + Math.sin(t * 3) * 8;
      fish.vy = 0;
    }

    if (state === 'play') {
      const wr = worldRule();
      const speedNow = SPEED * (slowUntil > t ? 0.66 : 1);
      // Echte Stroemung: sanfte Wellen ziehen den Fisch abwechselnd hoch und runter.
      let currentAccel = (Math.sin(t * wr.currentFreq + 0.7) + 0.42 * Math.sin(t * wr.currentFreq * 0.47 + 2.15)) * wr.currentForce;
      if (wr.level >= 4) currentAccel += Math.sin(t * 2.35 + score * 0.22) * wr.currentForce * 0.22;
      fish.vy += (GRAVITY + currentAccel) * dt;
      fish.y += fish.vy * dt;

      spawnT -= dt;
      if (spawnT <= 0) {
        const min = 60 + GAP / 2, max = FLOOR - 40 - GAP / 2;
        let gapY;
        if (D.mode === 'straight') {
          gapY = (min + max) / 2;                       // immer geradeaus
        } else if (D.mode === 'gentle') {
          const base = lastGapY === null ? (min + max) / 2 : lastGapY;
          gapY = Math.max(min, Math.min(max, base + (Math.random() - 0.5) * 160));
        } else {
          gapY = min + Math.random() * (max - min);
        }
        lastGapY = gapY;
        const jetRoll = Math.random() < wr.jetChance;
        const jetDir = Math.random() < 0.5 ? -1 : 1; // -1 = von unten nach oben, +1 = von oben nach unten
        pipes.push({
          x: W + 10, gapY, base: gapY, moving: D.mode === 'moving',
          phase: Math.random() * 6.28, amp: 45, scored: false,
          pearl: Math.random() < 0.7 ? { off: (Math.random() - 0.5) * 50, taken: false } : null,
          power: Math.random() < 0.13 ? { type: POWER_TYPES[Math.floor(Math.random()*POWER_TYPES.length)], off: (Math.random()-.5)*72, taken:false, seed:Math.random()*8 } : null,
          jet: jetRoll ? { dir: jetDir, force: wr.jetForce, triggered: false, activeUntil: 0, seed: Math.random() * 10 } : null
        });
        spawnT = 270 / speedNow;
      }

      for (const p of pipes) {
        p.x -= speedNow * dt;
        if (p.moving) {
          p.gapY = Math.max(60 + GAP / 2, Math.min(FLOOR - 40 - GAP / 2, p.base + Math.sin(t * 1.8 + p.phase) * p.amp));
        }
        if (!p.scored && p.x + PIPEW < fish.x - fish.r) {
          p.scored = true; score++; save.stats.maxRun = Math.max(save.stats.maxRun, score); beep(880, 0.07); checkProgress();
        }

        // Zufälliger Strömungs-Jet aus einer Säule. Er wird nur einmal pro Säulenpaar ausgelöst.
        if (p.jet && !p.jet.triggered) {
          const inJetX = fish.x > p.x - 18 && fish.x < p.x + PIPEW + 26;
          const inGapY = fish.y > p.gapY - GAP / 2 - 12 && fish.y < p.gapY + GAP / 2 + 12;
          if (inJetX && inGapY) {
            p.jet.triggered = true;
            p.jet.activeUntil = t + 0.34;
            fish.vy += p.jet.dir * p.jet.force;
            beep(p.jet.dir < 0 ? 760 : 260, 0.11);
          }
        }

        if (p.pearl && !p.pearl.taken) {
          const px = p.x + PIPEW / 2, py = p.gapY + p.pearl.off;
          const pickupRadius = magnetUntil > t ? 135 : fish.r + 11;
          if (Math.hypot(fish.x - px, fish.y - py) < pickupRadius) {
            p.pearl.taken = true;
            const reward = pearlReward() * (doubleUntil > t ? 2 : 1);
            save.pearls += reward; runPearls += reward; save.stats.pearlsCollected += reward;
            persist(); checkProgress();
            beep(1200, 0.06);
          }
        }
        if (p.power && !p.power.taken) {
          const px = p.x + PIPEW / 2, py = p.gapY + p.power.off;
          if (Math.hypot(fish.x - px, fish.y - py) < fish.r + 15) {
            p.power.taken = true; activatePower(p.power.type);
          }
        }
      }
      pipes = pipes.filter(p => p.x > -PIPEW - 20);

      if (fish.y - fish.r < 0) { fish.y = fish.r; fish.vy = 0; }
      if (fish.y + fish.r >= FLOOR) {
        fish.y = FLOOR - fish.r;
        if (t >= invulnUntil) { if (!useShield()) die(); }
      }

      const r = fish.r * 0.8;
      for (const p of pipes) {
        if (t < invulnUntil) break;
        if (fish.x + r > p.x && fish.x - r < p.x + PIPEW &&
            (fish.y - r < p.gapY - GAP / 2 || fish.y + r > p.gapY + GAP / 2)) {
          if (!useShield()) die();
          break;
        }
      }
    }

    if (state === 'over') {
      overT += dt;
      flash = Math.max(0, flash - dt * 3);
      if (fish.y + fish.r < FLOOR) {
        fish.vy += GRAVITY * 0.6 * dt;
        fish.y = Math.min(FLOOR - fish.r, fish.y + fish.vy * dt);
      }
    }
  }

  function drawColumn(x, y, w, h) {
    if (h <= 0) return;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    const colors={ocean:['#d9573f','#ff8a65','#c4442f'],space:['#151515','#666666','#0b0b0b'],lava:['#6e130b','#ff7a0d','#9a1a05'],ice:['#64b8e8','#e8ffff','#317cae'],forest:['#174c22','#58b847','#0b662f']}[save.world];
    g.addColorStop(0,colors[0]);g.addColorStop(.5,colors[1]);g.addColorStop(1,colors[2]);
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.34)'; ctx.shadowBlur=10; ctx.shadowOffsetX=3; ctx.fillStyle = g; ctx.fillRect(x, y, w, h); ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.16)'; ctx.fillRect(x+5,y,6,h);
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(x+w-8,y,8,h);
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (let yy = y + 12; yy < y + h; yy += 26) ctx.fillRect(x + 8, yy, w - 16, 3);
    // Eigene Verzierungen je Welt; auf den Saeulen bleiben die Luecken frei.
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    const mid = x + w / 2;
    for (let yy = y + 18; yy < y + h; yy += 42) {
      if (save.world === 'ocean') {
        // Korallen, Muscheln und Luftblasen
        ctx.strokeStyle = '#ffe2ba'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(mid, yy + 12); ctx.lineTo(mid, yy - 9);
        ctx.moveTo(mid, yy + 2); ctx.lineTo(mid - 12, yy - 7);
        ctx.moveTo(mid, yy + 5); ctx.lineTo(mid + 12, yy - 5); ctx.stroke();
        ctx.strokeStyle = '#c5f6ff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x + 12, yy - 7, 5, 0, Math.PI * 2); ctx.stroke();
      } else if (save.world === 'space') {
        // Leuchtende Sterne und Metallnieten
        ctx.fillStyle = '#fff1a8';
        ctx.beginPath(); ctx.moveTo(mid, yy - 13); ctx.lineTo(mid + 5, yy - 3);
        ctx.lineTo(mid + 16, yy); ctx.lineTo(mid + 5, yy + 3);
        ctx.lineTo(mid, yy + 13); ctx.lineTo(mid - 5, yy + 3);
        ctx.lineTo(mid - 16, yy); ctx.lineTo(mid - 5, yy - 3); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#a7b8cf'; ctx.beginPath(); ctx.arc(x + 9, yy, 3, 0, 7); ctx.arc(x + w - 9, yy, 3, 0, 7); ctx.fill();
      } else if (save.world === 'lava') {

        ctx.strokeStyle = '#ffdc53'; ctx.lineWidth = 4; ctx.shadowColor = '#ff4500'; ctx.shadowBlur = 9;
        ctx.beginPath(); ctx.moveTo(x + 9, yy - 14); ctx.lineTo(mid - 5, yy - 3);
        ctx.lineTo(mid + 7, yy - 8); ctx.lineTo(x + w - 12, yy + 12); ctx.stroke();
        ctx.shadowBlur = 0;
      } else if (save.world === 'ice') {
        // Schneeflocken und Kristalle
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        for (let a = 0; a < 3; a++) {
          const ang = a * Math.PI / 3;
          ctx.beginPath(); ctx.moveTo(mid - Math.cos(ang) * 14, yy - Math.sin(ang) * 14);
          ctx.lineTo(mid + Math.cos(ang) * 14, yy + Math.sin(ang) * 14); ctx.stroke();
        }
        ctx.fillStyle = '#d5faff'; ctx.beginPath(); ctx.arc(x + 12, yy + 10, 4, 0, 7); ctx.fill();
      } else if (save.world === 'forest') {
        // Lianen, Blaetter und kleine Blueten

        ctx.beginPath(); ctx.moveTo(mid, yy - 18); ctx.quadraticCurveTo(mid - 20, yy, mid, yy + 18); ctx.stroke();

        ctx.fillStyle = '#ffb9dc'; ctx.beginPath(); ctx.arc(mid + 10, yy - 12, 4, 0, 7); ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawPowerUp(x,y,type,r=13){

  function drawPipe(p) {
    const topH = p.gapY - GAP / 2;
    const botY = p.gapY + GAP / 2;
    drawColumn(p.x, 0, PIPEW, topH - 22);
    drawColumn(p.x, botY + 22, PIPEW, FLOOR - botY - 22);
    const capBase=({space:'#8a8a8a',lava:'#ff541b',ice:'#c5f6ff',forest:'#226f27',ocean:'#b53a26'})[save.world];
    const capGrad=ctx.createLinearGradient(p.x-6,0,p.x+PIPEW+6,0); capGrad.addColorStop(0,'rgba(0,0,0,.25)');capGrad.addColorStop(.18,capBase);capGrad.addColorStop(.55,'rgba(255,255,255,.34)');capGrad.addColorStop(1,capBase);
    ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=9;ctx.fillStyle=capGrad;
    rr(p.x-8,topH-26,PIPEW+16,26,7);ctx.fill(); rr(p.x-8,botY,PIPEW+16,26,7);ctx.fill();ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(p.x-2,topH-23,PIPEW-4,4);ctx.fillRect(p.x-2,botY+3,PIPEW-4,4);

    // Sichtbarer Strömungs-Jet: obere Säule drückt nach unten, untere Säule schießt nach oben.
    if (p.jet) {
      const active = p.jet.activeUntil > t;
      const pulse = 0.58 + Math.sin(t * 9 + p.jet.seed) * 0.18;
      const jetColor = ({ocean:'120,235,255',space:'145,175,255',lava:'255,190,70',ice:'225,255,255',forest:'170,255,120'})[save.world] || '180,240,255';
      const sourceY = p.jet.dir < 0 ? botY : topH;
      const sign = p.jet.dir < 0 ? -1 : 1;
      ctx.save();
      ctx.globalAlpha = active ? 0.95 : pulse;
      ctx.strokeStyle = `rgba(${jetColor},${active ? .92 : .65})`;
      ctx.fillStyle = `rgba(${jetColor},${active ? .90 : .58})`;
      ctx.lineWidth = active ? 4 : 2.4;
      ctx.shadowColor = `rgba(${jetColor},.85)`;
      ctx.shadowBlur = active ? 18 : 10;
      for (let j = 0; j < 5; j++) {
        const xx = p.x + 10 + j * (PIPEW - 20) / 4;
        const len = (active ? 68 : 45) + Math.sin(t * 7 + j + p.jet.seed) * 7;
        ctx.beginPath();
        ctx.moveTo(xx, sourceY + sign * 4);
        ctx.lineTo(xx + Math.sin(t * 6 + j) * 4, sourceY + sign * len);
        ctx.stroke();
        const ay = sourceY + sign * len;
        ctx.beginPath();
        ctx.moveTo(xx, ay + sign * 9);
        ctx.lineTo(xx - 5, ay - sign * 1);
        ctx.lineTo(xx + 5, ay - sign * 1);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    if (p.pearl && !p.pearl.taken) {
      drawPearl(p.x + PIPEW / 2, p.gapY + p.pearl.off + Math.sin(t * 4 + p.x * 0.05) * 3, 9);
    }
    if (p.power && !p.power.taken) {
      drawPowerUp(p.x + PIPEW/2, p.gapY + p.power.off + Math.sin(t*4+p.power.seed)*3, p.power.type, 13);
    }
  }

  function drawFloor() {

  // Zeichnet einen Fisch im Ursprung (Koordinatensystem vorher verschieben)
  function paintFish(s, wag) {
    if(['rocket','ufo','comet','alien'].includes(s.pat)){
      ctx.fillStyle=s.fin;ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(-31,-11);ctx.lineTo(-31,11);ctx.fill();
      ctx.fillStyle=s.body;ctx.beginPath();ctx.ellipse(0,0,s.pat==='ufo'?25:19,s.pat==='ufo'?10:16,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=s.belly;ctx.beginPath();ctx.ellipse(6,-4,9,8,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#18223b';ctx.beginPath();ctx.arc(9,-4,3,0,Math.PI*2);ctx.fill();
      if(s.pat==='rocket'){ctx.fillStyle='#ffae42';ctx.beginPath();ctx.moveTo(-20,-7);ctx.lineTo(-37,0);ctx.lineTo(-20,7);ctx.fill();}
      if(s.pat==='alien'){ctx.fillStyle='#173d32';ctx.beginPath();ctx.ellipse(9,-5,7,5,0,0,Math.PI*2);ctx.fill();}
      return;
    }
    const r = fish.r * (s.scale || 1);
    const rx = r + (s.pat === 'shark' ? 7 : 3), ry = r;

    // Schwanz
    ctx.fillStyle = s.fin;
    ctx.save();
    ctx.translate(-rx + 2, 0);
    ctx.rotate(wag);
    const tl = s.pat === 'shark' ? 24 : 18;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(-tl, -tl * 0.7); ctx.lineTo(-tl, tl * 0.7);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // Extras hinter dem Koerper
    if (s.pat === 'puffer') {
      ctx.fillStyle = s.fin;
      for (let a = 0; a < Math.PI * 2; a += 0.52) {
        ctx.beginPath();
        ctx.moveTo(Math.cos(a - 0.12) * (rx - 1), Math.sin(a - 0.12) * (ry - 1));
        ctx.lineTo(Math.cos(a) * (rx + 6), Math.sin(a) * (ry + 6));
        ctx.lineTo(Math.cos(a + 0.12) * (rx - 1), Math.sin(a + 0.12) * (ry - 1));
        ctx.closePath(); ctx.fill();
      }
    }
    if (s.pat === 'shark') {
      ctx.fillStyle = s.fin;
      ctx.beginPath();
      ctx.moveTo(-6, -ry + 3); ctx.lineTo(3, -ry - 14); ctx.lineTo(11, -ry + 3);
      ctx.closePath(); ctx.fill();
    }
    if (s.pat === 'angler') {
      ctx.strokeStyle = '#8a7aa8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(4, -ry + 3);
      ctx.quadraticCurveTo(14, -ry - 20, 28, -ry - 10);
      ctx.stroke();
      const g = ctx.createRadialGradient(28, -ry - 10, 1, 28, -ry - 10, 11);
      g.addColorStop(0, 'rgba(255,248,176,1)');
      g.addColorStop(1, 'rgba(255,230,80,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(28, -ry - 10, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe85a';
      ctx.beginPath(); ctx.arc(28, -ry - 10, 3.2, 0, Math.PI * 2); ctx.fill();
    }

    // Koerper
    let fill = s.body;
    if (s.pat === 'rainbow') {
      const g = ctx.createLinearGradient(-rx, 0, rx, 0);
      for (let i = 0; i <= 4; i++) g.addColorStop(i / 4, `hsl(${(t * 120 + i * 70) % 360},90%,60%)`);
      fill = g;
    }
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();

    // Bauch
    ctx.fillStyle = s.belly;
    ctx.beginPath(); ctx.ellipse(2, ry * 0.4, rx - 5, ry / 2.3, 0, 0, Math.PI * 2); ctx.fill();

    // Muster
    if (s.pat === 'clown') {
      ctx.save();
      ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-9, -ry, 6, ry * 2);
      ctx.fillRect(6, -ry, 5, ry * 2);
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1.2;
      ctx.strokeRect(-9, -ry, 6, ry * 2);
      ctx.strokeRect(6, -ry, 5, ry * 2);
      ctx.restore();
    }
    if (s.pat === 'doctor') {
      ctx.strokeStyle = '#0a1a3a';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(-2, 0, ry - 5, -0.9, 1.3); ctx.stroke();
    }
    if (s.pat === 'shark') {
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.moveTo(2 + i * 4, -3); ctx.lineTo(2 + i * 4, 5); ctx.stroke();
      }
    }

    // Seitenflosse
    ctx.fillStyle = s.fin;
    ctx.beginPath(); ctx.ellipse(-2, 3, 8, 4, 0.5 + wag * 0.5, 0, Math.PI * 2); ctx.fill();

    // Zaehne (Anglerfisch)
    if (s.pat === 'angler') {
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 3; i++) {
        const tx = rx - 12 + i * 4;
        ctx.beginPath();
        ctx.moveTo(tx, 5); ctx.lineTo(tx + 2, 11); ctx.lineTo(tx + 4, 5);
        ctx.closePath(); ctx.fill();
      }
    }

    // Auge
    const ex = rx * 0.45, ey = -ry * 0.3, er = s.pat === 'angler' ? ry * 0.38 : ry * 0.3;
    ctx.fillStyle = s.pat === 'angler' ? '#fff6b0' : '#fff';
    ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(ex + er * 0.3, ey, er * 0.5, 0, Math.PI * 2); ctx.fill();
  }

  function drawFish() {
    ctx.save();
    ctx.translate(fish.x, fish.y);
    const ang = state === 'over' ? 0.9 : Math.max(-0.5, Math.min(0.9, fish.vy / 600));
    ctx.rotate(ang);
    ctx.shadowColor=save.world==='space'?'rgba(130,170,255,.7)':'rgba(0,20,40,.38)';ctx.shadowBlur=12;ctx.shadowOffsetY=4;
    paintFish(skinById(save.skin), Math.sin(t * 18) * 0.35);
    ctx.shadowBlur=0;ctx.shadowOffsetY=0;
    ctx.globalAlpha=.45;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(7,-8,8,3,-.2,0,Math.PI*2);ctx.fill();
    if (shieldActive) { ctx.globalAlpha=.8;ctx.strokeStyle='#7ce8ff';ctx.lineWidth=3;ctx.shadowColor='#7ce8ff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(0,0,29+Math.sin(t*7)*2,0,Math.PI*2);ctx.stroke(); }
    ctx.restore();
  }

  function drawShop() {
    ctx.fillStyle = 'rgba(0,20,45,0.68)';
    ctx.fillRect(0, 0, W, H);
    text('Shop - '+(WORLDS.find(w=>w.id===save.world).name), W / 2, 58, 34);
    drawPearl(W / 2 - 62, 89, 9);
    text(save.pearls + ' Perlen', W / 2 - 46, 97, 22, '#ffe9a8', 'left');

    for (let i = 0; i < currentSkins().length; i++) {
      const s = currentSkins()[i];
      const ry = ROW0 + i * ROWH;
      const owned = save.owned.includes(s.id);
      const equipped = save.skin === s.id;
      const hidden = s.id === 'rainbow' && !owned;

      ctx.fillStyle = equipped ? 'rgba(120,255,160,0.22)' : 'rgba(255,255,255,0.12)';
      rr(30, ry, 420, ROWHH, 12); ctx.fill();
      ctx.strokeStyle = equipped ? 'rgba(140,255,170,0.9)' : 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      ctx.stroke();

      if (hidden) {
        text('?', 78, ry + 38, 30, '#9fb7cc');
        text('???', 125, ry + 34, 22, '#9fb7cc', 'left');
        text('Irgendwo versteckt ...', 435, ry + 34, 16, '#9fb7cc', 'right');
      } else {
        ctx.save();
        ctx.translate(78, ry + ROWHH / 2);
        ctx.scale(0.82, 0.82);
        paintFish(s, Math.sin(t * 10 + i) * 0.3);
        ctx.restore();
        text(s.name, 125, ry + 34, 22, '#ffffff', 'left');
        if (equipped) text('Ausgerüstet', 435, ry + 34, 17, '#9dffb0', 'right');
        else if (owned) text('Gekauft - antippen', 435, ry + 34, 16, '#d6ecff', 'right');
        else text(s.price + ' Perlen', 435, ry + 34, 18, save.pearls >= s.price ? '#ffe9a8' : '#ff9a8a', 'right');
      }
    }

    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    rr(BACKBTN.x, BACKBTN.y, BACKBTN.w, BACKBTN.h, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2; ctx.stroke();
    text('Zurück', W / 2, BACKBTN.y + 30, 22);
  }

  function drawAdmin() {
    ctx.fillStyle = 'rgba(0,15,35,0.82)';
    ctx.fillRect(0, 0, W, H);
    text('Admin-Panel', W / 2, 92, 38, '#ffd27a');
    text(save.owned.length + ' / ' + allSkins().length + ' Skins | ' + save.pearls + ' Perlen', W / 2, 132, 18, '#d6ecff');
    for (const b of ADMIN_BTNS) {
      const armed = b.id === 'reset' && t < resetArm;
      ctx.fillStyle = armed ? 'rgba(255,110,90,0.45)'
        : b.id === 'close' ? 'rgba(255,255,255,0.18)' : 'rgba(255,215,110,0.22)';
      rr(b.x, b.y, b.w, b.h, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2; ctx.stroke();
      text(armed ? 'Sicher? Nochmal tippen' : b.label, b.x + b.w / 2, b.y + 30, 19);
    }
  }

  function draw() {
    drawBackground();
    for (const p of pipes) drawPipe(p);
    drawFloor();
    if (!['shop','worlds','extras','about','admin'].includes(state)) drawFish();

    if (state === 'shop') {
      drawShop();
    } else if (state === 'worlds') {
      drawWorlds();
    } else if (state === 'extras') {
      drawExtras();
    } else if (state === 'about') {
      drawAbout();
    } else if (state === 'admin') {
      drawAdmin();
    } else {
      // Anzeige: Perlen links, Rekord rechts
      drawPearl(22, 26, 8);
      text(String(save.pearls), 38, 33, 22, '#ffe9a8', 'left');
      text('Rekord ' + bestNow() + ' (' + D.name + ')', W - 14, 33, 18, '#ffe9a8', 'right');
      if (state !== 'ready') text(String(score), W / 2, 100, 64);
      if (state === 'play') {
        let px=24;
        if (shieldActive) { drawPowerUp(px,61,'shield',10); px+=28; }
        if (magnetUntil>t) { drawPowerUp(px,61,'magnet',10); px+=28; }
        if (slowUntil>t) { drawPowerUp(px,61,'slow',10); px+=28; }
        if (doubleUntil>t) { drawPowerUp(px,61,'double',10); }
      }
    }

    if (state === 'ready') {
      ctx.save();ctx.shadowColor='rgba(0,0,0,.30)';ctx.shadowBlur=18;ctx.fillStyle='rgba(3,24,46,.30)';rr(28,145,424,128,22);ctx.fill();ctx.restore();
      ctx.strokeStyle='rgba(255,255,255,.20)';ctx.lineWidth=1.5;rr(28,145,424,128,22);ctx.stroke();
      ctx.fillStyle='rgba(4,22,42,.24)';rr(18,318,444,304,22);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.13)';ctx.stroke();
      text('Water Flappy', W / 2, 190, 48 + titlePulse * 8);
      text('Welt: '+(WORLDS.find(w=>w.id===save.world).name),W/2,239,21,'#c9f5ff');
      text('Strömung: '+worldRule().label+' • Welt-Level '+worldRule().level+' • Perlen x'+worldRule().pearlMult,W/2,264,14,'#bfeaff');
      text('Tippen oder Leertaste', W / 2, 345, 24, '#ffe9a8');
      text('zum Schwimmen', W / 2, 376, 24, '#ffe9a8');
      text('Schwierigkeit - schwerer = mehr Perlen', W / 2, 426, 16, '#d6ecff');
      DIFFS.forEach((d, i) => {
        const b = diffBtn(i);
        const active = save.diff === i;
        ctx.fillStyle = active ? 'rgba(255,215,110,0.38)' : 'rgba(255,255,255,0.12)';
        rr(b.x, b.y, b.w, b.h, 12); ctx.fill();
        ctx.strokeStyle = active ? '#ffe9a8' : 'rgba(255,255,255,0.3)';
        ctx.lineWidth = active ? 3 : 1.5; ctx.stroke();
        text(d.name, b.x + b.w / 2, b.y + 22, 17, active ? '#ffffff' : '#cfe6f7');
        text('x' + (d.mult * worldRule().pearlMult) + ' Perlen', b.x + b.w / 2, b.y + 41, 13, active ? '#ffe9a8' : '#a9c6dc');
      });
      drawButton(WORLD_BTN,'Welten');
      drawButton(SHOPBTN,'Shop');
      drawButton(EXTRASBTN,'Extras');
      drawButton(ABOUTBTN,'Über uns');
      if (!storageOK) text('Speichern blockiert', W / 2, 638, 12, '#ff9a8a');
    }

    if (state === 'over') {
      ctx.fillStyle = 'rgba(0,20,45,0.6)';
      ctx.fillRect(60, 175, W - 120, 285);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2;
      ctx.strokeRect(60, 175, W - 120, 285);
      text('Game Over', W / 2, 232, 42, '#ff9a8a');
      text('Punkte: ' + score, W / 2, 288, 32);
      text('Rekord: ' + bestNow(), W / 2, 327, 24, '#ffe9a8');
      text('+' + runPearls + ' Perlen  (Bonus x' + pearlReward() + ')', W / 2, 365, 22, '#ffd1ea');
      if (score > 0 && score >= bestNow()) text('Neuer Rekord!', W / 2, 396, 20, '#9dffb0');
      if (overT > 0.45) text('Tippen für Neustart', W / 2, 438, 18, '#d6ecff');
    }

    if (t < toast.until) {
      ctx.font = '800 18px system-ui, Arial, sans-serif';
      const w = Math.min(W - 20, ctx.measureText(toast.text).width + 36);
      ctx.fillStyle = 'rgba(0,20,45,0.8)';
      rr(W / 2 - w / 2, 114, w, 34, 17); ctx.fill();
      text(toast.text, W / 2, 137, 18, '#ffffff');
    }

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.7})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Eingabe ----------
  window.addEventListener('keydown', e => {
    if (e.key && e.key.length === 1) {
      keyBuf = (keyBuf + e.key.toLowerCase()).slice(-4);
      if (keyBuf === 'nemo') { keyBuf = ''; triggerEgg(); }
    }
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (!e.repeat) flap();
    } else if (state === 'ready' && /^Digit[1-4]$/.test(e.code)) {
      applyDiff(+e.code.slice(5) - 1, true);
    } else if (state === 'ready' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
      applyDiff(Math.max(0, Math.min(DIFFS.length - 1, save.diff + (e.code === 'ArrowRight' ? 1 : -1))), true);
    } else if (e.code === 'KeyS' && state === 'ready') {
      state = 'shop';
    } else if (e.code === 'Escape' && (state === 'shop' || state === 'admin' || state === 'worlds' || state === 'extras' || state === 'about')) {
      if (state === 'admin') reset();
      state = 'ready';
    }
  });

  c.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = c.getBoundingClientRect();
    const x = (e.clientX - r.left) * W / r.width;
    const y = (e.clientY - r.top) * H / r.height;
    if (state === 'ready') {
      for (let i = 0; i < DIFFS.length; i++) {
        if (inRect(x, y, diffBtn(i))) { applyDiff(i, true); beep(600 + i * 120, 0.06); return; }
      }
      if (inRect(x,y,WORLD_BTN)){state='worlds';return;}
      if (inRect(x, y, SHOPBTN)) { state = 'shop'; beep(660, 0.05); return; }
      if (inRect(x, y, EXTRASBTN)) { state = 'extras'; beep(760, 0.05); return; }
      if (inRect(x, y, ABOUTBTN)) { state = 'about'; beep(720, 0.05); return; }
      if (inRect(x, y, TITLE)) {
        if (t - eggLast > 1.5) eggTaps = 0;
        eggLast = t; eggTaps++; titlePulse = 1;
        beep(500 + eggTaps * 40, 0.04);
        if (eggTaps >= 7) { eggTaps = 0; triggerEgg(); }
        return;
      }
      flap();
    } else if (state === 'shop') {
      shopClick(x, y);
    } else if (state === 'worlds') {
      worldClick(x,y);
    } else if (state === 'extras') {
      if (inRect(x, y, BACKBTN)) state = 'ready';
    } else if (state === 'about') {
      if (inRect(x, y, BACKBTN)) state = 'ready';
    } else if (state === 'admin') {
      adminClick(x, y);
    } else {
      flap();
    }
  });

  // ---------- Immer speichern ----------
  window.addEventListener('pagehide', persist);
  document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
  setInterval(persist, 10000);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  // ---------- Loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
